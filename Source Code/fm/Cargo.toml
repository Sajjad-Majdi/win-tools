[package]
name = "fmcore"
version = "0.2.2"
edition = "2024"
description = "Rust File Explorer: fast file manager core (library) and the wfm CLI"

[lib]
name = "fmcore"
path = "src/lib.rs"

# wfm.exe: console CLI for agents and scripts (table by default, --json for machines)
[[bin]]
name = "wfm"
path = "src/bin/wfm.rs"

# RustFileExplorer.exe: the file manager window (Win32 + Direct2D, no webview)
[[bin]]
name = "RustFileExplorerWinE"
path = "src/bin/winkey.rs"

[[bin]]
name = "RustFileExplorer"
path = "src/bin/wfiles/main.rs"

# examples/savedlg.rs is a test helper only (opens a Save dialog on a hidden desktop); it is not shipped.

[dependencies]
serde_json = "1.0.151"
windows-numerics = "0.2"
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Time",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole",
  "Win32_System_Diagnostics_Debug", "Win32_System_StationsAndDesktops", "Win32_System_Memory",
  "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_Ioctl",
  "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WNet",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Gdi", "Win32_Graphics_Imaging",
  "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls",
  "Win32_System_DataExchange", "Win32_System_Pipes", "Win32_System_LibraryLoader", "Win32_System_SystemInformation",
  "Win32_Networking_WinHttp", "Win32_System_Variant", "Win32_Storage_Xps", "Win32_Security_Cryptography",
  "Foundation", "Data_Pdf", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_System_WinRT",
  "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_DirectComposition", "Storage", "Storage_Streams", "Graphics_Imaging", "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

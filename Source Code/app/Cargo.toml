[package]
name = "wintools"
version = "0.2.11"
edition = "2024"

[lib]
name = "wt"
path = "src/lib.rs"

# wtm.exe: console CLI for agents and scripts (JSON output, exit codes)
[[bin]]
name = "wtm"
path = "src/bin/wtm.rs"

# RustTaskManager.exe: the Task Manager window
[[bin]]
name = "RustTaskManager"
path = "src/bin/wintask.rs"

[dependencies]
serde_json = "1.0.151"
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Registry",
  "Win32_System_Services", "Win32_System_Com", "Win32_System_Console", "Win32_System_Pipes",
  "Win32_System_IO", "Win32_System_Memory", "Win32_System_Ioctl", "Win32_System_Performance",
  "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Diagnostics_Debug",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi",
] }
windows-numerics = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
